; ============================================================================
; Solar System
; ============================================================================
;
; Units:   km, kg, km^3/s^2, degrees
; Angles:  inclination / node / argument of periapsis / mean anomaly
;
; PLANETS + PLUTO
;   Elements are derived from JPL's "Keplerian Elements for Approximate
;   Positions of the Major Planets" (Standish), evaluated at the epoch
;   below (T = +0.26 Julian centuries from J2000).
;
;   Note that JPL publishes mean longitude L and longitude of perihelion
;   varpi, NOT the argument of periapsis and mean anomaly this file wants.
;   The conversion used here is:
;       argument_of_periapsis = varpi - Omega
;       mean_anomaly          = L - varpi
;   (The original file mixed the two conventions: Mercury/Venus/Earth used
;   varpi where Mars..Pluto used omega, and Earth's "mean anomaly" was
;   actually its mean longitude, which put Earth ~100 deg off.)
;
; MOONS
;   Semi-major axis, eccentricity and inclination are mean values. Only
;   Earth's Moon has a mean anomaly / node / apse propagated to the epoch;
;   every other moon's mean_anomaly is an ARBITRARY PHASE so the system
;   doesn't start with everything lined up at periapsis. Periods, orbit
;   shapes and relative sizes are correct; where a given moon sits along
;   its orbit on day zero is not.
;
;   Moon inclinations are given relative to the J2000 ecliptic, which for
;   the close-in regular satellites is an approximation - they actually
;   precess about their planet's Laplace plane, which this two-body setup
;   cannot represent.
;
; DWARF PLANETS
;   a / e / i / node / argument are current osculating values; mean
;   anomalies are derived from perihelion passage and are approximate.
; ============================================================================

[System]
name = Solar System
epoch_tdb = 2026-01-01T00:00:00
reference = J2000_ECLIPTIC
origin = SYSTEM_BARYCENTER


