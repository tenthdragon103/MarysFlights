; ============================================================================
; TRAPPIST-1
; ============================================================================
;
; Units:  km, kg, km^3/s^2, degrees
; Distance from Sol: 40.66 ly, constellation Aquarius
;
; An ultracool M8V dwarf (0.0898 Msun, barely larger than Jupiter) with
; seven roughly Earth-sized planets, all orbiting inside 0.062 AU - the
; whole system would fit inside Mercury's orbit around the Sun. Planets
; b through h are locked in a chain of near-integer period ratios
; (8:5:3:2:3:2:4:3:3:2), which keeps their eccentricities small and
; stable rather than damping them to zero.
;
; RENDERER NOTE
;   This system is a good stress test for the marker/real-scale crossover:
;   at system view all seven planets are close enough to the star and to
;   each other that they should sit on marker scale, while your existing
;   solar-scale renderer constants (tuned for AU-scale spacing) will make
;   them nearly overlap unless cameraDistance's minimum clamp and the
;   marker pixel thresholds are re-checked for a system this compact.
;   Consider a smaller "focusBody" starting distance multiplier here.
;
; SOURCES
;   Star mass/radius ........ Van Grootel et al. 2018 / Agol et al. 2021
;   Periods, masses, e ....... Agol et al. 2021 (TTV solution)
;   Mutual inclination,
;   longitude of periastron,
;   mean anomaly ............. Raymond et al. 2022 (fiducial N-body setup)
;   Radii .................... Agol et al. 2021 / Grimm et al. 2018
;
; CAVEATS
;   - "Mutual inclination" here is relative inclination between adjacent
;     planets' orbital planes, not inclination to a solar-system-style
;     ecliptic; the system's absolute orientation in space (as seen from
;     Earth it's edge-on, i ~ 89.5-89.9 deg, which is WHY it transits and
;     was discovered at all) is not meaningful for an isolated simulation
;     and is not reproduced here. Longitude of ascending node is set to
;     0 for all seven planets so "inclination" only encodes their small
;     relative tilts to each other.
;   - Mean anomalies are propagated from the Raymond et al. 2022 epoch
;     (~BJD 2457000, 2015-01-03) to this file's 2026-01-01 epoch using
;     each planet's own period. Because these orbits are resonant and
;     the underlying fit has its own uncertainties, don't expect the
;     libration angles to be perfectly self-consistent after long
;     integration - this is a snapshot, not a fitted N-body solution.
;   - No known moons; none would be dynamically stable this close to a
;     resonant chain packed this tightly.
; ============================================================================

