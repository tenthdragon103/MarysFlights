; ============================================================================
; Milky Way - the solar neighbourhood, orbiting the galactic barycenter
; ============================================================================
;
; Units:  km, kg, km^3/s^2, degrees
;
; FRAME
;   reference = GALACTOCENTRIC: origin at the galactic centre, x pointing
;   from the Sun toward the centre (so the Sun sits at x = -8.122 kpc), z
;   toward the north galactic pole, so the galactic disk is the x-y plane. Galactic
;   rotation is CLOCKWISE seen from the north pole, which is why disk stars
;   show inclinations near 180 deg (retrograde with respect to +z) -
;   that is the correct physical sense, not an error. Kapteyn's Star, a
;   retrograde halo star, is the exception at i = 46 deg.
;   Solar position/velocity: R0 = 8.122 kpc (GRAVITY 2018), z = 20.8 pc,
;   v = (12.9, 245.6, 7.78) km/s (astropy Galactocentric defaults).
;
; WHAT IS REAL
;   Every body's starting position AND velocity comes from its measured
;   parallax, proper motion and radial velocity, transformed into the frame
;   above and converted to orbital elements. Check: heliocentric speeds
;   recovered from the inputs match published values (Barnard's Star
;   142.6 km/s, Kapteyn's 294 km/s, Arcturus 122 km/s). Elements round-trip
;   back to the original state vectors to ~1e-15 of the orbit radius.
;   Astrometry is Hipparcos/Gaia-era catalog values (Proxima, Barnard's,
;   Wolf 359, Sirius etc. rounded to ~4-5 digits); treat as "good to a few
;   per cent in velocity", not as a citable ephemeris.
;
; THE ONE BIG APPROXIMATION - READ THIS
;   Your engine does two-body Keplerian orbits, but a galaxy is not a point
;   mass: its rotation curve is flat (~230 km/s from 3 to 30 kpc), whereas a
;   point mass gives v ~ r^-1/2. The root body below therefore carries an
;   EFFECTIVE mass chosen so that the Sun's own speed is the circular speed
;   at the Sun's radius:
;       mu = |v_sun|^2 * R_sun = 1.517404e+22 km^3/s^2  (= 1.143e11 Msun enclosed)
;   That is close to the real mass inside the Sun's orbit, and it gives the
;   Sun a=8.122 kpc, e=0.052, period 203 Myr
;   (the commonly quoted galactic year is ~225-250 Myr).
;   Consequences:
;     * Positions/velocities at t=0 are real. Orbits are trustworthy for
;       roughly the next ~10-30 Myr and for relative motion between nearby
;       stars on that timescale. Beyond that the model drifts.
;     * Stars with large peculiar velocities (Kapteyn's, Arcturus, Barnard's,
;       61 Cyg A) get exaggerated eccentricities - a point mass over-binds
;       the inner galaxy, so their pericentres are too deep.
;     * Vertical oscillation through the disk and epicycle/shear rates are
;       wrong (real disk: ~2.7 x orbital frequency vertically; Kepler: 1x).
;     * mass is the effective enclosed mass; mass/G is NOT Sgr A*'s mass
;       (that is 4.3e6 Msun, ~25,000x smaller). Radius is Sgr A*'s
;       Schwarzschild radius, so the body renders as a point.
;
; DELIBERATELY LEFT OUT
;   LMC, SMC, Sagittarius dwarf: their real speeds exceed the point-mass
;     escape speed here (e.g. 321 km/s vs 140 km/s at the LMC's 50 kpc), so
;     no elliptical element set exists for them under this approximation.
;   Omega Centauri, M4, M13: current speeds are low (near apocentre), so a
;     point mass sends them to within 0.06-0.6 kpc of the centre; the real
;     orbits do not do that. 47 Tuc and M22 are the clusters that stay
;     sensible (pericentre > 1.5 kpc).
;   Sgr A* itself and the S-stars (S2 has a real 16-year Keplerian orbit):
;     would need Sgr A*'s true mass as parent, which conflicts with the
;     effective mass above. Better as its own system file.
;   The disk, arms, bulge and ~10^11 other stars: not bodies. Showing them
;     needs a point-sprite/particle renderer, separate from this engine.
;
; USING THE SOLAR SYSTEM INSIDE THIS FILE
;   The Sun below has no planets. Append the [Body.*] sections from
;   solar_system.ini (they are parented to Sun and ride along unchanged).
; ============================================================================

[System]
name = Milky Way (solar neighbourhood)
epoch_tdb = 2026-01-01T00:00:00
reference = GALACTOCENTRIC
origin = SYSTEM_BARYCENTER


; ----------------------------------------------------------------------------
; Galactic barycenter - EFFECTIVE enclosed mass, not Sgr A*'s mass (see header)
; ----------------------------------------------------------------------------

[Body.GalacticCenter]
name = Galactic Center (Sagittarius A*)
mass = 2.27350e+41
radius = 12690499.3
mu = 1.517404e+22
parent = SYSTEM_BARYCENTER
color = orange


; ----------------------------------------------------------------------------
; The Sun
; ----------------------------------------------------------------------------

; G2V; 20.8 pc above the galactic midplane, moving inward at ~13 km/s toward pericentre
; R_gc=8.1220 kpc  v=246.1 km/s  P=202.8 Myr  peri=7.697 kpc  apo=8.547 kpc
[Body.Sun]
name = Sun
mass = 1.98847e+30
radius = 696340.0
mu = 1.327124e+11
parent = GalacticCenter
semi_major_axis = 2.50618733169e+17
eccentricity = 0.052344758
inclination = 178.1720284
longitude_of_ascending_node = 184.6025379
argument_of_periapsis = 97.6053762
