; ============================================================================
; 55 Cancri (Rho1 Cancri, HD 75732)
; ============================================================================
;
; Units:  km, kg, km^3/s^2, degrees
; Distance from Sol: 40.9 ly, constellation Cancer
;
; A wide visual binary: 55 Cancri A (the planet host, K0/G8V) has a red-dwarf
; companion, 55 Cancri B, at a projected separation of about 1065 AU -
; roughly 80x wider than Pluto's orbit around the Sun. B is included as a
; distant, near-static third body; it has no known planets of its own and
; is far enough out that it barely perturbs the inner system on human
; timescales.
;
; Five known planets span nearly four orders of magnitude in period
; (0.74 days to 14.3 years) and mass (8 Earths to 3.8 Jupiters):
;   e - ultra-short-period "lava world" super-Earth, the only one that
;       transits, hence the only one with a directly measured radius.
;   b - a close-in gas giant, ~0.82 Jupiter masses.
;   c - a Neptune-mass planet in 3:1 resonance with b.
;   f - Saturn-mass-ish, sits inside the star's habitable zone (though the
;       planet itself is a gas giant, not habitable).
;   d - the outermost, a true Jupiter analog at ~5.7 AU, eccentric.
;
; SOURCES
;   Star mass/radius .......... von Braun et al. 2011 (interferometric)
;   Planet e ................... Bourrier et al. 2018 (HST/STIS transit fit)
;   Planets b, c, d, f .......... Nelson et al. 2014 (self-consistent N-body
;                                 RV solution); periods/eccentricities/
;                                 arguments of periastron and periastron
;                                 epochs are the long-standing Fischer et
;                                 al. 2008 discovery values, still widely
;                                 used as the reference orbit.
;   Companion B separation ..... Mugrauer et al. 2006
;
; CAVEATS
;   - Only planet e transits, so only its radius is directly measured.
;     Radii for b, c, d, and f are ESTIMATES from mass-radius relations for
;     gas/ice giants of similar mass and irradiation, not measurements:
;     flag them as approximate if your UI surfaces radius as a fact.
;   - Planet c's argument of periastron is poorly constrained by the
;     discovery data (near-circular orbit); set to 0 here as a placeholder
;     - don't read anything into where c starts along its orbit.
;   - Mean anomalies are propagated from each planet's own published time
;     of periastron passage to this file's 2026-01-01 epoch using each
;     planet's own period, independently. Because the outer planets'
;     periods carry real uncertainty (d's period is known to only about
;     +/- 230 days), don't expect long-term propagation to stay accurate -
;     this is a snapshot, not a fitted ephemeris.
;   - 55 Cancri B's position below is a placeholder direction/distance, not
;     a measured relative position vector; treat it as illustrative of the
;     system's scale, not a precise binary orbit (no orbital solution for
;     B exists - at ~1065 AU projected separation its orbital period would
;     be on the order of tens of thousands of years, essentially motionless
;     on any human timescale).
; ============================================================================

[System]
name = 55 Cancri
epoch_tdb = 2026-01-01T00:00:00
reference = J2000_ECLIPTIC
origin = SYSTEM_BARYCENTER


[Body.55CancriA]
