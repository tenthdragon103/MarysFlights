; ============================================================================
; Alpha Centauri (Rigil Kentaurus / Toliman / Proxima)
; ============================================================================
;
; Units:   km, kg, km^3/s^2, degrees
; Distance from Sol: 4.344 ly (A/B), 4.2465 ly (Proxima)
;
; !!! IMPORTANT - READ BEFORE LOADING !!!
;
; This is a hierarchical TRIPLE, not a star with planets. The relative
; orbit of a two-body pair is governed by mu = G*(M_parent + M_child),
; not by the parent's mu alone. If your loader uses only parent->getMu()
; for a child's initial state, Alpha Cen B's period comes out at about
; 108 years instead of the correct 79.76, because B is 84% as massive
; as A and is NOT a test particle.
;
; Two ways to fix it, pick one:
;
;   1) Preferred: in your element-to-state conversion use
;         mu = parent.mu + body.mu
;      This is correct everywhere and is a no-op for real planets and
;      moons, where the child's mu is negligible.
;
;   2) Quick hack: override the gravitational parameter used for the
;      pair. The "mu_system" keys below carry the right values if you
;      add support for them; otherwise delete those lines.
;
; Sources:
;   A/B orbit and stellar parameters ... Akeson et al. 2021
;   Proxima's orbit about AB .......... Kervella, Thevenin & Lovis 2017
;   Proxima b / d ..................... Suarez Mascareno et al. 2025
;   Proxima c (disputed) .............. Damasso et al. 2020 /
;                                       Benedict & McArthur 2020
;
; CAVEATS
;   - The A/B elements are measured in the plane of the sky, referenced
;     to the celestial equator, NOT to the J2000 ecliptic. Node and
;     inclination therefore orient the orbit relative to Earth's line of
;     sight. Left as published; the system's internal geometry is right,
;     its orientation with respect to a solar-system-style ecliptic frame
;     is not meaningful.
;   - Proxima's published a = 8700 AU and P = 547,000 yr are separate fits
;     and are not quite self-consistent. Integrating from a = 8700 AU
;     gives about 559,000 yr. Set a = 8560 AU if you want P = 547,000.
;   - Proxima c is unconfirmed; recent NIRPS observations failed to
;     recover it. Delete that section for a conservative system.
;   - Alpha Cen Ab (the JWST/VLT direct-imaging candidate around A) is
;     included but commented out - it is a candidate only, and its orbit
;     is barely constrained (a = 1.6-2.2 AU, i = 15-165 deg).
;   - Planet radii are mass-radius estimates. None of these planets
;     transits, so no radius has been measured.
; ============================================================================

[System]
name = Alpha Centauri
epoch_tdb = 2026-01-01T00:00:00
reference = J2000_ECLIPTIC
origin = SYSTEM_BARYCENTER


; ----------------------------------------------------------------------------
; Alpha Centauri A - G2V, 1.0788 Msun, the system anchor
; ----------------------------------------------------------------------------

[Body.AlphaCentauriA]
name = Rigil Kentaurus
mass = 2.14516e30
radius = 847015
mu = 1.431702e11
parent = SYSTEM_BARYCENTER
color = yellow


; ----------------------------------------------------------------------------
; Alpha Centauri B - K1V, 0.9092 Msun
;
;   P = 79.762 yr, periastron 11.2 AU, apastron 35.6 AU
;   Periastron epoch T = 1875.66 -> next passage May 2035
;   mean_anomaly = 360 * (2026.0 - 1875.66) / 79.762  (mod 360)
; ----------------------------------------------------------------------------

[Body.AlphaCentauriB]
name = Toliman
mass = 1.80792e30
radius = 597676
mu = 1.206622e11
parent = AlphaCentauriA
mu_system = 2.638323e11
semi_major_axis = 3485480789
eccentricity = 0.51947
inclination = 79.243
longitude_of_ascending_node = 205.073
argument_of_periapsis = 231.519
mean_anomaly = 318.549
color = orange


; ----------------------------------------------------------------------------
; Proxima Centauri (Alpha Centauri C) - M5.5Ve, 0.1221 Msun
;
;   Currently near apastron: 12,947 AU from the AB barycentre.
;   Periastron 4,300 AU, apastron 13,000 AU.
;   Periastron epoch T = AD 283, P = 547,000 yr, so the system has
;   barely moved: mean anomaly is only ~1.1 deg past periastron... of
;   the PREVIOUS passage. Nothing visible will happen here in a human
;   lifetime of simulated time.
;
;   Parented to A for convenience. Strictly it orbits the AB barycentre,
;   so mu_system covers all three masses.
; ----------------------------------------------------------------------------

[Body.ProximaCentauri]
name = Proxima Centauri
mass = 2.42792e29
radius = 107277
mu = 1.620419e10
parent = AlphaCentauriA
mu_system = 2.800365e11
semi_major_axis = 1301501475090
eccentricity = 0.50
inclination = 107.6
longitude_of_ascending_node = 126.0
argument_of_periapsis = 72.3
mean_anomaly = 1.147
color = red


; ----------------------------------------------------------------------------
; Proxima d - sub-Earth, innermost, 5.12 d
;   m sin i >= 0.260 Me, circular orbit assumed by the discovery fit
; ----------------------------------------------------------------------------

[Body.ProximaD]
name = Proxima Centauri d
mass = 1.5528e24
radius = 5166
mu = 103.636
parent = ProximaCentauri
semi_major_axis = 4309915
eccentricity = 0.0
inclination = 0.0
longitude_of_ascending_node = 0.0
argument_of_periapsis = 0.0
mean_anomaly = 0.0
color = darkgray


; ----------------------------------------------------------------------------
; Proxima b - the habitable-zone terrestrial, 11.18 d
;   m sin i >= 1.055 Me. Habitable zone spans 0.0373 - 0.088 AU.
;   Orbital plane unknown; inclination of the star's spin axis is
;   47 +/- 7 deg, which is the usual assumption for the planets.
; ----------------------------------------------------------------------------

[Body.ProximaB]
name = Proxima Centauri b
mass = 6.3007e24
radius = 7016
mu = 420.523
parent = ProximaCentauri
semi_major_axis = 7252505
eccentricity = 0.0
inclination = 0.0
longitude_of_ascending_node = 0.0
argument_of_periapsis = 0.0
mean_anomaly = 180.0
color = blue


; ----------------------------------------------------------------------------
; Proxima c - DISPUTED candidate sub-Neptune, 1928 d (5.28 yr)
;   Published as longitude of periastron -4 deg with node 331 deg,
;   hence argument of periapsis = -4 - 331 = 25 deg (mod 360).
;   Time of periastron JD 2456202 -> mean anomaly below.
;   Delete this block if you want only confirmed bodies.
; ----------------------------------------------------------------------------

[Body.ProximaC]
name = Proxima Centauri c
mass = 4.1805e25
radius = 15945
mu = 2790.203
parent = ProximaCentauri
semi_major_axis = 222751229
eccentricity = 0.04
inclination = 133.0
longitude_of_ascending_node = 331.0
argument_of_periapsis = 25.0
mean_anomaly = 129.9
color = skyblue


